<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Update Order - King Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h3 class="mb-4 text-center text-warning">Update Order Status</h3>
    <form>
      <div class="mb-3">
        <label class="form-label">Order ID</label>
        <input type="text" class="form-control" placeholder="Enter order ID" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Order Status</label>
        <select class="form-select">
          <option selected>Select status</option>
          <option>Pending</option>
          <option>Shipped</option>
          <option>Delivered</option>
          <option>Cancelled</option>
        </select>
      </div>

      <button type="submit" class="btn btn-warning w-100">Update Order</button>
    </form>
  </div>
</div>

</body>
</html>
