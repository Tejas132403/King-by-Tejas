<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KING Website Filters</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .filter-section {
      max-width: 300px;
      border-right: 1px solid #ccc;
      padding: 20px;
    }
    .product-grid {
      padding: 20px;
    }
  </style>
</head>
<body>

<div class="container-fluid">
  <div class="row">
    
    <div class="col-md-3 filter-section">
      <h5>Filters</h5>

      
      <div class="mb-3">
        <h6 data-bs-toggle="collapse" href="#categoriesCollapse" role="button" aria-expanded="true">CATEGORIES</h6>
        <div class="collapse show" id="categoriesCollapse">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="homeLighting">
            <label class="form-check-label" for="homeLighting">Suger free</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="decorLighting">
            <label class="form-check-label" for="decorLighting">chocolate</label>
          </div>
        </div>
      </div>

      
      <div class="mb-3">
        <h6 data-bs-toggle="collapse" href="#brandCollapse" role="button">BRAND</h6>
        <div class="collapse" id="brandCollapse">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="brand1">
            <label class="form-check-label" for="brand1">Dairy Milk</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="brand2">
            <label class="form-check-label" for="brand2">Kit kat</label>
          </div>
        </div>
      </div>

      
      <div class="mb-3">
        <h6 data-bs-toggle="collapse" href="#shapeCollapse" role="button">SHAPE</h6>
        <div class="collapse" id="shapeCollapse">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="shape1">
            <label class="form-check-label" for="shape1">Round</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="shape2">
            <label class="form-check-label" for="shape2">Leaf</label>
          </div>
        </div>
      </div>

      
      <div class="mb-3">
        <h6>PRICE</h6>
        <input type="range" class="form-range" min="0" max="3000" step="50" id="priceRange">
        <div class="d-flex justify-content-between">
          <input type="number" class="form-control form-control-sm w-50 me-2" placeholder="Min">
          <input type="number" class="form-control form-control-sm w-50" placeholder="Max">
        </div>
      </div>

    </div>

    
    <div class="col-md-9 product-grid">
      <h4>Products</h4>
      
      <div class="row">
