<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Admin | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">

<div class="card p-4 shadow-lg" style="width: 400px;">
  <h3 class="text-center mb-3">👑 King Admin</h3>
  <form id="adminLoginForm">
    <div class="mb-3">
      <label class="form-label">Admin ID</label>
      <input type="text" class="form-control" id="adminId" required>
    </div>
    <div class="mb-1">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="adminPass" required>
    </div>
    <p id="errorMsg" class="text-danger small mt-1" style="display:none;">Invalid ID or Password!</p>
    <button type="submit" class="btn btn-dark w-100 mt-2">Login</button>
  </form>
</div>

<script>
  document.getElementById("adminLoginForm").addEventListener("submit", function(e) {
    e.preventDefault(); 
    
    const id = document.getElementById("adminId").value.trim();
    const pass = document.getElementById("adminPass").value.trim();
    const errorMsg = document.getElementById("errorMsg");
    
    if (id === "122" && pass === "3525") {
      errorMsg.style.display = "none";
      window.location.href = "A_dashboard.html";
    } else {
      errorMsg.style.display = "block";
    }
  });
</script>

</body>
</html>
