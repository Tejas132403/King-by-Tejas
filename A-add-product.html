<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Product - King Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h3 class="mb-4 text-center text-primary">Add New Product</h3>
    <form>
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Product Name</label>
          <input type="text" class="form-control" placeholder="Enter product name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <select class="form-select">
            <option selected>Select category</option>
            <option>Electronics</option>
            <option>Clothing</option>
            <option>Home & Kitchen</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="3" placeholder="Enter product description"></textarea>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Price ($)</label>
          <input type="number" class="form-control" min="0" step="0.01" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Stock Quantity</label>
          <input type="number" class="form-control" min="1" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Product Image</label>
          <input type="file" class="form-control">
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Add Product</button>
    </form>
  </div>
</div>

</body>
</html>
