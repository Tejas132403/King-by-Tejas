<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | King</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="card shadow-lg border-0" style="max-width: 850px; width: 100%;">
    <div class="row g-0">

      <div class="col-md-5 d-flex flex-column justify-content-between text-white p-4" style="background-color:#2874f0;">
        <div>
          <h2 class="fw-bold">Login</h2>
          <p class="mb-0">Get access to your Orders, Wishlist and Recommendations</p>
        </div>
        <img src="https://img.icons8.com/color/200/000000/laptop.png" alt="Login illustration" class="img-fluid mx-auto d-block mt-4" style="max-width:180px;">
      </div>

      <div class="col-md-7 bg-white p-4">
        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Enter Email / Mobile number</label>
            <input type="text" class="form-control" id="email" placeholder="Enter Email or Mobile" required>
          </div>
          <p class="small text-muted">
            By continuing, you agree to King's 
            <a href="#" class="text-decoration-none">Terms of Use</a> and 
            <a href="#" class="text-decoration-none">Privacy Policy</a>.
          </p>
          <button type="submit" class="btn w-100 py-2 text-white fw-bold" style="background-color:#fb641b;">
            Request OTP
          </button>
        </form>
        <div class="text-center mt-3">
          <a href="#" class="text-decoration-none">New to King? Create an account</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault(); 
      const email = document.getElementById("email").value.trim();
      if (email) {
       
        window.location.href = "index.html";
      } else {
        alert("Please enter your Email or Mobile number.");
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
