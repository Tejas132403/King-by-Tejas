<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Banner - King Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h3 class="text-center text-secondary mb-4">Add Home Page Banner</h3>
    <form>
      <div class="mb-3">
        <label class="form-label">Banner Title</label>
        <input type="text" class="form-control" placeholder="Enter banner title">
      </div>
      <div class="mb-3">
        <label class="form-label">Banner Image</label>
        <input type="file" class="form-control" accept="image/*" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Link (Optional)</label>
        <input type="url" class="form-control" placeholder="Enter redirect link">
      </div>
      <div class="mb-3">
        <label class="form-label">Status</label>
        <select class="form-select">
          <option>Active</option>
          <option>Inactive</option>
        </select>
      </div>
      <button type="submit" class="btn btn-secondary w-100">Upload Banner</button>
    </form>
  </div>
</div>
</body>
</html>
