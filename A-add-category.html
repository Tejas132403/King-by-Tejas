<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Category - King Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h3 class="mb-4 text-center text-success">Add New Category</h3>
    <form>
      <div class="mb-3">
        <label class="form-label">Category Name</label>
        <input type="text" class="form-control" placeholder="Enter category name" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Category Description</label>
        <textarea class="form-control" rows="3" placeholder="Describe the category"></textarea>
      </div>

      <button type="submit" class="btn btn-success w-100">Add Category</button>
    </form>
  </div>
</div>

</body>
</html>
