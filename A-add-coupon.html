<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Coupon - King Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h3 class="text-center text-danger mb-4">Create New Coupon</h3>
    <form>
      <div class="mb-3">
        <label class="form-label">Coupon Code</label>
        <input type="text" class="form-control" placeholder="Enter coupon code" required>
      </div>
      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Discount (%)</label>
          <input type="number" class="form-control" min="1" max="100" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Valid From</label>
          <input type="date" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Valid To</label>
          <input type="date" class="form-control" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Usage Limit</label>
        <input type="number" class="form-control" min="1" placeholder="Number of times coupon can be used">
      </div>
      <button type="submit" class="btn btn-danger w-100">Add Coupon</button>
    </form>
  </div>
</div>
</body>
</html>
