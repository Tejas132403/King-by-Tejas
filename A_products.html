<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Admin | Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="d-flex" id="wrapper">

  <div class="bg-dark text-white p-3 sidebar">
    <h4 class="text-center mb-4">👑 King</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a href="A_dashboard.html" class="nav-link active">Dashboard</a></li>
      <li class="nav-item"><a href="A_products.html" class="nav-link">Products</a></li>
      <li class="nav-item"><a href="A_orders.html" class="nav-link">Orders</a></li>
      <li class="nav-item"><a href="A_users.html" class="nav-link">Users</a></li>
      <li class="nav-item"><a href="A-add-admin.html" class="nav-link active">Add Admin</a></li>
      <li class="nav-item"><a href="A-add-banner.html" class="nav-link active">Add banner</a></li>
      <li class="nav-item"><a href="A-add-category.html" class="nav-link active">Add catagory</a></li>
      <li class="nav-item"><a href="A-add-coupon.html" class="nav-link active">Add coupan</a></li>
      <li class="nav-item"><a href="A-add-product.html" class="nav-link active">Add product</a></li>
      <li class="nav-item"><a href="A-add-user.html" class="nav-link active">Add user</a></li>
      <li class="nav-item"><a href="A-settings.html" class="nav-link active">setting</a></li>
      <li class="nav-item"><a href="A-update-order.html" class="nav-link active">update</a></li>
      <li class="nav-item mt-3"><a href="login.html" class="nav-link text-danger">Logout</a></li>
    </ul>
  </div>

  <div class="p-4 w-100">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Products</h2>
      <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addProduct">+ Add Product</button>
    </div>

    <table class="table table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Image</th>
          <th>Name</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td><img src="/Web site/photos/watch.webp" width="50" height="50" class="rounded"></td>
          <td>Royal Watch</td>
          <td>25,000</td>
          <td>10</td>
          <td>
            <button class="btn btn-sm btn-warning">Edit</button>
            <button class="btn btn-sm btn-danger">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="addProduct" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Add Product</h5></div>
      <div class="modal-body">
        <form>
          <input type="text" class="form-control mb-2" placeholder="Product Name">
          <input type="number" class="form-control mb-2" placeholder="Price">
          <input type="number" class="form-control mb-2" placeholder="Stock">
          <input type="file" class="form-control mb-2">
          <textarea class="form-control mb-2" placeholder="Description"></textarea>
          <button class="btn btn-dark w-100">Save</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
