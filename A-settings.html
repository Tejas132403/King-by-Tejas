<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Settings - King Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h3 class="text-center text-primary mb-4">Website Settings</h3>
    <form>
      <div class="mb-3">
        <label class="form-label">Website Name</label>
        <input type="text" class="form-control" value="King E-Commerce" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contact Email</label>
        <input type="email" class="form-control" placeholder="admin@king.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Phone Number</label>
        <input type="tel" class="form-control" placeholder="+1 234-567-890">
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" rows="3" placeholder="Business address"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Logo Upload</label>
        <input type="file" class="form-control" accept="image/*">
      </div>
      <button type="submit" class="btn btn-primary w-100">Save Settings</button>
    </form>
  </div>
</div>
</body>
</html>
