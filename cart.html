<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Cart Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row g-4">

    <div class="col-lg-8">

      <div class="card mb-3">
        <div class="row g-0 align-items-center">
          <div class="col-md-3 text-center">
            <img src="https://rukminim2.flixcart.com/image/224/224/xif0q/computer/p/s/6/-original-imahfkh3qhgauvpq.jpeg?q=90" 
                 class="img-fluid p-2" alt="Product">
          </div>
          <div class="col-md-9">
            <div class="card-body">
              <h5 class="card-title">Lenovo LOQ Intel Core i5 13th Gen</h5>
              <div class="d-flex align-items-baseline gap-2 mb-2">
                <h5 class="fw-bold text-dark mb-0">₹74,990</h5>
                <small class="text-muted text-decoration-line-through">₹1,04,490</small>
              </div>
              <div class="d-flex gap-3">
                <button class="btn btn-sm btn-outline-secondary">-</button>
                <span class="mt-1">1</span>
                <button class="btn btn-sm btn-outline-secondary">+</button>
                <a href="#" class="text-decoration-none text-danger">Remove</a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="row g-0 align-items-center">
          <div class="col-md-3 text-center">
            <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/shoe/m/l/m/-original-imahddyzhk9mqnw6.jpeg?q=70" 
                 class="img-fluid p-2" alt="Product">
          </div>
          <div class="col-md-9">
            <div class="card-body">
              <h5 class="card-title">Adidas Shoes For Women</h5>
              <div class="d-flex align-items-baseline gap-2 mb-2">
                <h5 class="fw-bold text-dark mb-0">₹3,199</h5>
                <small class="text-muted text-decoration-line-through">₹7,999</small>
              </div>
              <div class="d-flex gap-3">
                <button class="btn btn-sm btn-outline-secondary">-</button>
                <span class="mt-1">1</span>
                <button class="btn btn-sm btn-outline-secondary">+</button>
                <a href="#" class="text-decoration-none text-danger">Remove</a>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="col-lg-4">
      <div class="card">
        <div class="card-body">
          <h6 class="fw-bold">Price Details</h6>
          <hr>
          <div class="d-flex justify-content-between mb-2">
            <span>Price (2 items)</span>
            <span>₹1,12,489</span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span>Discount</span>
            <span class="text-success">- ₹33,500</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between fw-bold mb-3">
            <span>Total Amount</span>
            <span>₹78,989</span>
          </div>
          
           <button onclick="window.location.href='order.html'"  class="btn btn-warning w-100 fw-bold">Go to Order Page</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
