<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Page | King</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row g-4">

    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <h5 class="fw-bold mb-3">Delivery Address</h5>
          <form>
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" placeholder="Enter your full name">
            </div>
            <div class="mb-3">
              <label class="form-label">Mobile Number</label>
              <input type="text" class="form-control" placeholder="Enter mobile number">
            </div>
            <div class="mb-3">
              <label class="form-label">Pincode</label>
              <input type="text" class="form-control" placeholder="Enter pincode">
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea class="form-control" rows="3" placeholder="Flat / House No, Street, Locality"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">City</label>
              <input type="text" class="form-control" placeholder="Enter city">
            </div>
            <div class="mb-3">
              <label class="form-label">State</label>
              <input type="text" class="form-control" placeholder="Enter state">
            </div>
            <button class="btn btn-primary">Save Address</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card">
        <div class="card-body">
          <h5 class="fw-bold">Order Summary</h5>
          <hr>
          <div class="d-flex justify-content-between">
            <span>Product 1</span>
            <span>₹74,990</span>
          </div>
          <div class="d-flex justify-content-between">
            <span>Product 2</span>
            <span>₹3,199</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between fw-bold">
            <span>Total</span>
            <span>₹78,189</span>
          </div>
          <a href="thankyou.html" class="btn btn-success w-100 mt-3">Place Order</a>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
