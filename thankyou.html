<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You - King</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

  <div class="container text-center">
    <div class="card shadow-lg border-0 rounded-4 mx-auto" style="max-width: 600px;">
      <div class="card-body p-5">
        <div class="mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="#28a745" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM6.97 10.97 4.47 8.47a.75.75 0 1 0-1.06 1.06L6.97 13.06l6.646-6.647a.75.75 0 0 0-1.06-1.06L6.97 10.97z"/>
          </svg>
        </div>

        <h1 class="fw-bold text-success">Thank You!</h1>
        <p class="text-muted mb-4">
          Your order has been placed successfully.  
          We appreciate your trust in <span class="fw-semibold">King</span>.
        </p>

        <div class="alert alert-success rounded-3">
          <strong>Order #12345</strong><br>
          A confirmation email has been sent to <em>your@email.com</em>.
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4">
          <a href="index.html" class="btn btn-primary px-4">Continue Shopping</a>
          <a href="cart.html" class="btn btn-outline-success px-4">View My Orders</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
